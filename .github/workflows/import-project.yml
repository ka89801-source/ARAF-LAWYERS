name: Import project files

on:
  push:
    paths:
      - '.upload_tmp/ready'

permissions:
  contents: write

jobs:
  unpack:
    if: github.event.head_commit.message != 'Import ARAF Lawyers project files'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source package and build
        shell: bash
        run: |
          cat .upload_tmp/s* | base64 -d > /tmp/araf-lawyers-src.zip
          rm -rf /tmp/araf-src
          mkdir -p /tmp/araf-src
          unzip -q /tmp/araf-lawyers-src.zip -d /tmp/araf-src
          cp /tmp/araf-src/araf-lawyers-src/* ./
          cp /tmp/araf-lawyers-src.zip ./araf-lawyers-src.zip
          python - <<'PY'
          from pathlib import Path
          p = Path('.')
          html = (p/'index.src.html').read_text()
          css = (p/'styles.css').read_text()
          js = '\n'.join((p/f).read_text() for f in ['data.js','core.js','app.js','views-cases.js','views-work.js','views-biz.js'])
          out = html.replace('/*CSS*/', css).replace('/*JS*/', js)
          (p/'index.html').write_text(out)
          (p/'araf-lawyers.html').write_text(out)
          PY
          rm -rf .upload_tmp
      - name: Commit imported files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import ARAF Lawyers project files"
          git push
