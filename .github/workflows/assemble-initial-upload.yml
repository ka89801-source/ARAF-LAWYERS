name: Assemble initial upload

on:
  push:
    paths:
      - '.upload_ready'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore original source archive and build HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zipfile, shutil

          parts = Path('.upload_parts/source-zip')
          encoded = ''.join(p.read_text().strip() for p in sorted(parts.glob('part-*')))
          archive = Path('/tmp/araf-lawyers-src.zip')
          archive.write_bytes(base64.b64decode(encoded))

          unpack = Path('/tmp/araf-unpack')
          with zipfile.ZipFile(archive) as z:
              z.extractall(unpack)

          extracted = unpack / 'araf-lawyers-src'
          target = Path('araf-lawyers-src')
          if target.exists():
              shutil.rmtree(target)
          shutil.copytree(extracted, target)

          html = (target / 'index.src.html').read_text()
          css = (target / 'styles.css').read_text()
          js = '\n'.join((target / f).read_text() for f in ['data.js','core.js','app.js','views-cases.js','views-work.js','views-biz.js'])
          out = html.replace('/*CSS*/', css).replace('/*JS*/', js)
          Path('index.html').write_text(out)
          Path('araf-lawyers.html').write_text(out)
          PY

      - name: Commit complete project and remove transport parts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .upload_parts .upload_ready
          git add araf-lawyers-src index.html araf-lawyers.html
          git commit -m "Import complete ARAF Lawyers project"
          git push
